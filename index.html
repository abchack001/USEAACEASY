<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兒童AAC點讀溝通板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: #f4f7f6; padding: 15px; text-align: center; }
    h1 { color: #2c3e50; font-size: 24px; margin-bottom: 12px; }
    
    /* 上方句子組合區 */
    .sentence-bar {
      background: #ffffff; border: 3px solid #3498db; border-radius: 16px;
      padding: 12px; min-height: 65px; display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    }
    .sentence-text { font-size: 26px; font-weight: bold; color: #2c3e50; flex-grow: 1; text-align: left; padding-left: 8px; }
    .action-btn {
      background-color: #2ecc71; color: white; border: none; padding: 10px 18px;
      font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-left: 6px;
    }
    .clear-btn { background-color: #e74c3c; }

    /* 分類標籤頁 */
    .category-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
    .tab-btn {
      background-color: #e0e6ed; border: none; padding: 10px 18px; font-size: 18px;
      font-weight: bold; border-radius: 20px; cursor: pointer; color: #34495e;
    }
    .tab-btn.active { background-color: #3498db; color: white; }

    /* 溝通卡片網格 */
    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px; max-width: 850px; margin: 0 auto;
    }
    .card {
      background: white; border: 3px solid #e0e0e0; border-radius: 18px;
      padding: 16px 8px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer; user-select: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.1s, background-color 0.1s;
    }
    .card:active { transform: scale(0.93); background-color: #ebf5fb; }
    .card-icon { font-size: 42px; margin-bottom: 6px; }
    .card-label { font-size: 22px; font-weight: bold; color: #2c3e50; }

    /* 分類色彩搭配 (高對比好視覺辨識) */
    .cat-needs { border-color: #f39c12; background-color: #fffde7; }
    .cat-actions { border-color: #3498db; background-color: #ebf5fb; }
    .cat-feelings { border-color: #e74c3c; background-color: #fdedec; }
    .cat-people { border-color: #9b59b6; background-color: #f5eeaf; }
  </style>
</head>
<body>

  <h1>💬 兒童 AAC 點讀溝通板</h1>

  <!-- 句子組合區 -->
  <div class="sentence-bar">
    <div id="sentence" class="sentence-text">點擊卡片組合句子...</div>
    <div>
      <button class="action-btn" onclick="speakSentence()">🔊 發音</button>
      <button class="action-btn clear-btn" onclick="clearSentence()">🗑️ 清除</button>
    </div>
  </div>

  <!-- 分類按鈕 -->
  <div class="category-tabs">
    <button class="tab-btn active" onclick="filterCategory('all', this)">全部圖卡</button>
    <button class="tab-btn" onclick="filterCategory('needs', this)">🍴 飲食需求</button>
    <button class="tab-btn" onclick="filterCategory('actions', this)">🏃 常用動作</button>
    <button class="tab-btn" onclick="filterCategory('feelings', this)">❤️ 感覺身體</button>
    <button class="tab-btn" onclick="filterCategory('people', this)">👨‍👩‍👧 人物稱呼</button>
  </div>

  <!-- 圖卡網格區 -->
  <div class="grid-container" id="cardGrid"></div>

  <script>
    // 兒童日常 AAC 高頻核心圖卡單字
    const cards = [
      // 需求與飲食
      { text: "我想要", icon: "🙋‍♂️", category: "actions", class: "cat-actions" },
      { text: "吃", icon: "🍚", category: "needs", class: "cat-needs" },
      { text: "喝", icon: "🥛", category: "needs", class: "cat-needs" },
      { text: "飯", icon: "🍱", category: "needs", class: "cat-needs" },
      { text: "水", icon: "💧", category: "needs", class: "cat-needs" },
      { text: "尿尿", icon: "🚽", category: "needs", class: "cat-needs" },
      { text: "便便", icon: "💩", category: "needs", class: "cat-needs" },
      { text: "飽", icon: "😋", category: "needs", class: "cat-needs" },
      { text: "餓", icon: "🤤", category: "needs", class: "cat-needs" },
      
      // 動作與活動
      { text: "要", icon: "⭕", category: "actions", class: "cat-actions" },
      { text: "不要", icon: "❌", category: "actions", class: "cat-actions" },
      { text: "睡覺", icon: "🛌", category: "actions", class: "cat-actions" },
      { text: "洗澡", icon: "🛁", category: "actions", class: "cat-actions" },
      { text: "看電視", icon: "📺", category: "actions", class: "cat-actions" },
      { text: "玩", icon: "🧸", category: "actions", class: "cat-actions" },
      { text: "走", icon: "🚶", category: "actions", class: "cat-actions" },
      { text: "抱抱", icon: "🫂", category: "actions", class: "cat-actions" },
      
      // 感覺與身體
      { text: "痛", icon: "🩹", category: "feelings", class: "cat-feelings" },
      { text: "累", icon: "😫", category: "feelings", class: "cat-feelings" },
      { text: "生氣", icon: "😡", category: "feelings", class: "cat-feelings" },
      { text: "怕", icon: "😨", category: "feelings", class: "cat-feelings" },
      { text: "好", icon: "👍", category: "feelings", class: "cat-feelings" },
      
      // 人物
      { text: "爸爸", icon: "👨", category: "people", class: "cat-people" },
      { text: "媽媽", icon: "👩", category: "people", class: "cat-people" },
      { text: "阿公", icon: "👴", category: "people", class: "cat-people" },
      { text: "阿嬤", icon: "👵", category: "people", class: "cat-people" },
      { text: "老師", icon: "👩‍🏫", category: "people", class: "cat-people" }
    ];

    let currentSentence = [];

    // 語音發音引擎 (Web Speech API)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 停止上一次未完語音
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW'; // 繁體中文語音
        utterance.rate = 0.8;    // 調整語速為稍慢 (適合學習與聽覺理解)
        utterance.pitch = 1.1;   // 稍微調高音調更親切
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的裝置不支援語音合成功能");
      }
    }

    // 點擊圖卡卡片
    function handleCardClick(text) {
      speakText(text);
      currentSentence.push(text);
      updateSentenceDisplay();
    }

    // 更新頂部顯示的句子
    function updateSentenceDisplay() {
      const display = document.getElementById("sentence");
      if (currentSentence.length === 0) {
        display.innerText = "點擊卡片組合句子...";
      } else {
        display.innerText = currentSentence.join(" ");
      }
    }

    // 整句發音
    function speakSentence() {
      if (currentSentence.length > 0) {
        speakText(currentSentence.join(""));
      }
    }

    // 清除句子
    function clearSentence() {
      currentSentence = [];
      updateSentenceDisplay();
    }

    // 渲染圖卡
    function renderCards(filter = "all") {
      const grid = document.getElementById("cardGrid");
      grid.innerHTML = "";
      
      cards.forEach(card => {
        if (filter === "all" || card.category === filter) {
          const cardEl = document.createElement("div");
          cardEl.className = `card ${card.class}`;
          cardEl.onclick = () => handleCardClick(card.text);
          cardEl.innerHTML = `
            <div class="card-icon">${card.icon}</div>
            <div class="card-label">${card.text}</div>
          `;
          grid.appendChild(cardEl);
        }
      });
    }

    // 分類按鈕切換
    function filterCategory(cat, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderCards(cat);
    }

    // 頁面初始化
    renderCards();
  </script>
</body>
</html>
